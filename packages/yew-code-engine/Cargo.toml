[package]
authors = ["Jonathan Gao <gsmlg.com@gmail.com>"]
categories = ["wasm", "web-programming", "gui"]
description = "A pure Rust code editor engine and Yew component."
edition = "2021"
keywords = ["code-editor", "wasm", "web", "yew"]
license = "GPL-3.0"
name = "yew-code-engine"
readme = "./README.md"
repository = "https://github.com/duskmoon-dev/yew-duskmoon-ui.git"
version = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew = { version = "0.23.0", features = ["csr"] }
web-sys = { version = "0.3", features = ["HtmlTextAreaElement"] }
