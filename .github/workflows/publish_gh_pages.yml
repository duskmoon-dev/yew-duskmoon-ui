name: Publish gh-pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7
        with:
          path: yew-duskmoon-ui

      - name: ⬇️ Checkout duskmoonui repo
        uses: actions/checkout@v7
        with:
          repository: duskmoon-dev/duskmoonui
          path: duskmoonui

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build duskmoonui core plugin
        working-directory: duskmoonui
        run: |
          bun install
          bun run build:core

      - name: Build example Tailwind CSS
        working-directory: yew-duskmoon-ui/example
        run: |
          bun install
          bun run build:css

      - name: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: trunk-action
        uses: jetli/trunk-action@v0.5.1

      # build css and rust
      - name: run trunk
        working-directory: yew-duskmoon-ui/example
        run: trunk build --release --public-url /yew-duskmoon-ui

      # deploy for github.io
      - name: GitHub Pages action
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: yew-duskmoon-ui/example/dist
