name: Publish GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: yew-duskmoon-ui

      - name: Checkout Duskmoon UI core
        uses: actions/checkout@v5
        with:
          repository: duskmoon-dev/duskmoonui
          path: duskmoonui

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Duskmoon UI core plugin
        working-directory: duskmoonui
        run: |
          bun install
          bun run build:core

      - name: Build demo CSS
        working-directory: yew-duskmoon-ui/example
        run: |
          bun install --frozen-lockfile
          bun run build:css

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.1

      - name: Build demo
        working-directory: yew-duskmoon-ui/example
        run: trunk build --release --public-url /yew-duskmoon-ui/

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: yew-duskmoon-ui/example/dist

  deploy:
    name: Deploy demo
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
