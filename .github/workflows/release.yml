name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3)"
        required: true
        type: string
      git_ref:
        description: "Git ref to release from"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release crate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update crate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          perl -0pi -e "s/^version = \"[^\"]+\"/version = \"$VERSION\"/m" packages/duskmoon/Cargo.toml
          cargo check --workspace --all-features

      - name: Build release package
        run: cargo package --package yew-duskmoon --allow-dirty

      - name: Verify crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error title=Missing crates.io token::Set the CARGO_REGISTRY_TOKEN repository secret to a crates.io API token."
            exit 1
          fi

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --package yew-duskmoon --allow-dirty --registry crates-io

      - name: Commit version bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git add packages/duskmoon/Cargo.toml Cargo.lock
          git commit -m "chore(release): v${VERSION}"

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
          GIT_REF: ${{ inputs.git_ref }}
        run: |
          git tag "v${VERSION}"
          git push origin "HEAD:${GIT_REF}"
          git push origin "v${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" \
            "target/package/yew-duskmoon-${VERSION}.crate" \
            --title "v${VERSION}" \
            --generate-notes
